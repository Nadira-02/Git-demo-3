<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Module 2 task 1</title>
</head>
<body>
    <h1>Prime number</h1>
    <p id="target"></p>
    <script>
        const num = parseInt(prompt("Enter an integer: "));
        let Prime = true;

        if (num <= 1) {
            Prime = false
        } else {
            for (let i = 2; i < num; i++) {
                if (num % i === 0){
                    Prime = false;
                    break;
                }
            }
        }
        if (Prime) {
            document.querySelector("#target").innerHTML = num + " is a prime number.";
        } else {
            document.querySelector("#target").innerHTML = num + " is not a prime number.";
        }
    </script>
</body>
</html>
