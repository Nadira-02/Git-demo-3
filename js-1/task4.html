<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Task 4</title>
</head>
<body>
    <h1>Leap year</h1>
    <p id="target"></p>
    <script>
        const year = parseInt(prompt("Enter a year: "));
        
        if (year % 4 === 0 && year % 100 !== 0) {
            document.querySelector("#target").innerHTML= year + " is a leap year.";
        } else if (year % 400 === 0) {
            document.querySelector("#target").innerHTML= year + " is a leap year.";
        } else {
            document.querySelector("#target").innerHTML= year + " is not a leap year.";
        }
    </script>
</body>
</html>
