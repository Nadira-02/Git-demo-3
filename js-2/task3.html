<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Task 3</title>
</head>
<body>
    <h1>Dice Rolls</h1>
    <ul id="target"></ul>

    <script>
        function rollDice() {
            return Math.floor(Math.random() * 6) + 1;
        }

        let htmlList = "";
        let roll;

        while (roll !== 6) {
            roll = rollDice();
            htmlList += `<li>Result: ${roll}</li>`;
        }
        document.querySelector("#target").innerHTML = htmlList;
    </script>
</body>
</html>
